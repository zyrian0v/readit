<div class="post">
        <!-- <span>{{ forloop.counter }}</span> -->
        {% include "readit/vote_partial.html" %}

        <div>
                {% if post.url %}
                        <a href="{{ post.url }}">{{ post.title }}</a>
                {% else %}
                        <a href="{% url 'post' post.board.name post.id %}">{{ post.title }}</a>
                {% endif %}

                <a class="small" href="{% url 'post' post.board.name post.id %}">
                        {{ post.comment_set.all.count }} Comments</a>

                {% if is_you %}
                        <form class="delete-post" action="{% url 'delete_post' post.board post.id %}" method="post">
                                {% csrf_token %}
                                <button>delete</button>
                        </form>
                {% endif %}

                <div class="small">
                        <a href="{% url 'profile' post.user %}">{{ post.user }}</a>
                </div>
        </div>
</div>
